<!doctype html>
<html lang="tl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Tintalata — Patnugot ng Dokumento at Guhit</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('tintalata_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f172a');
          }
        } catch (e) {}
        try {
          window.__tintalataInstallPrompt = null;
          window.__tintalataInstalled = false;
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__tintalataInstallPrompt = e;
            window.__tintalataInstalled = false;
            window.dispatchEvent(new Event('tintalata:install-ready'));
          });
          window.addEventListener('appinstalled', function () {
            window.__tintalataInstallPrompt = null;
            window.__tintalataInstalled = true;
            window.dispatchEvent(new Event('tintalata:app-installed'));
          });
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512-maskable.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
